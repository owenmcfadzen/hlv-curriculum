<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
  /* Suppress the benign, intermittent "ResizeObserver loop" notification and
     defer RO callbacks a frame. */
  (function () {
    var RE = /ResizeObserver loop/;
    window.addEventListener("error", function (e) {
      if (e && e.message && RE.test(e.message)) { e.stopImmediatePropagation(); e.preventDefault(); return false; }
    }, true);
    var prevOnError = window.onerror;
    window.onerror = function (msg) {
      if (typeof msg === "string" && RE.test(msg)) return true;
      return prevOnError ? prevOnError.apply(this, arguments) : false;
    };
    ["error", "warn"].forEach(function (m) {
      var o = console[m];
      console[m] = function () {
        for (var i = 0; i < arguments.length; i++) {
          if (typeof arguments[i] === "string" && RE.test(arguments[i])) return;
        }
        return o.apply(console, arguments);
      };
    });
    var N = window.ResizeObserver;
    if (N) window.ResizeObserver = function (cb) {
      return new N(function (e, o) { requestAnimationFrame(function () { cb(e, o); }); });
    };
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HLV · Summer School '26</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="studio/app.css" />
<style>
  #root:empty::after { content: "Studio"; position: fixed; inset: 0; display: grid; place-items: center;
    font: 800 22px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -.02em; color: #C4C0BA; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="studio/data.generated.js"></script>
<script type="text/babel" src="studio/components.jsx"></script>
<script type="text/babel" src="studio/views.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { Rail, Topbar, FilterBar, WeekSwitch, D } = window.StudioUI;
const { PlanView, DayView, SessionDetail, Inspector } = window.StudioViews;

const HOUR_PX = 64;

// Fields a user may edit; merged from /api/overrides onto the static sessions.
const EDITABLE = ["title", "day", "start", "end", "track", "group", "kind", "room", "note", "aspects", "assets", "facils", "sub"];
function applyOverride(s, ov) { if (!ov) return; for (const k of EDITABLE) if (k in ov) s[k] = ov[k]; }

// Pick a "today" — first day whose date matches now, else first day in range, else 0.
function pickToday() {
  // Open on Day 1 (Mon Jun 29), the program start, for presenting front-to-back.
  return 0;
}

function App() {
  const [view, setView] = useState("week");
  const [sel, setSel] = useState(null);
  const [session, setSession] = useState(null);
  const [dayI, setDayI] = useState(pickToday());
  const [weekIdx, setWeekIdx] = useState(0);
  const [filters, setFilters] = useState({ tracks: new Set(), aspects: new Set() });
  const [rev, setRev] = useState(0);            // bump to re-render after edits
  const [apiOn, setApiOn] = useState(true);     // false when no write server (static host)
  const [editToken, setEditTokenState] = useState(() => {
    try { return localStorage.getItem("hlv_edit_token") || ""; } catch { return ""; }
  });
  const setEditToken = (v) => {
    setEditTokenState(v || "");
    try { if (v) localStorage.setItem("hlv_edit_token", v); else localStorage.removeItem("hlv_edit_token"); } catch {}
  };
  const ovRef = useRef({});                     // current overrides map, keyed by sid

  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--r", "0px");
    r.style.setProperty("--hour", HOUR_PX + "px");
  }, []);

  // Load persisted edits once and merge onto the static sessions.
  useEffect(() => {
    fetch("/api/overrides")
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(ov => {
        ovRef.current = ov || {};
        D.SESSIONS.forEach(s => applyOverride(s, ovRef.current[s.sid]));
        setRev(r => r + 1);
      })
      .catch(() => setApiOn(false));
  }, []);

  // Persist a patch for one session: mutate in memory, bump, POST the full map.
  const saveSession = (sid, patch) => {
    const merged = { ...ovRef.current, [sid]: { ...(ovRef.current[sid] || {}), ...patch } };
    ovRef.current = merged;
    const s = D.SESSIONS.find(x => x.sid === sid);
    if (s) Object.assign(s, patch);
    setRev(r => r + 1);
    return fetch("/api/overrides", {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(editToken ? { "X-Edit-Token": editToken } : {}) },
      body: JSON.stringify(merged),
    }).then(r => { if (!r.ok) { const e = new Error(r.status === 401 ? "unauthorized" : "save failed"); e.status = r.status; throw e; } return r.json(); });
  };

  const toggle = (group, key) => setFilters(f => {
    const next = new Set(f[group]);
    next.has(key) ? next.delete(key) : next.add(key);
    return { ...f, [group]: next };
  });
  const clear = () => setFilters({ tracks: new Set(), aspects: new Set() });
  const filtering = filters.tracks.size > 0 || filters.aspects.size > 0;
  const match = (s) => {
    if (filters.tracks.size && !filters.tracks.has(s.track)) return false;
    if (filters.aspects.size && !s.aspects.some(a => filters.aspects.has(a))) return false;
    return true;
  };
  const counts = { total: D.SESSIONS.length, shown: D.SESSIONS.filter(match).length };

  const openSession = (s) => { setSession(s); setSel(null); setView("session"); };
  const goView = (v) => { if (["week", "plan", "day"].includes(v)) { setView(v); } };

  return (
    <div className="app">
      <Rail view={view} setView={goView} />
      <div className="main">
        <Topbar view={view} setView={goView} editToken={editToken} setEditToken={setEditToken} apiOn={apiOn} />
        {(view === "week" || view === "plan" || view === "day") &&
          <FilterBar filters={filters} toggle={toggle} clear={clear} counts={counts} />}
        {view === "week" && <WeekSwitch weekIdx={weekIdx} setWeekIdx={setWeekIdx} />}
        <div className={"scroller" + (view === "week" ? " fit" : "")}>
          {view === "week"   && <PlanView hourPx={HOUR_PX} onSelect={setSel} selId={sel?.id} match={match} filtering={filtering} mode="week" weekIdx={weekIdx} />}
          {view === "plan"   && <PlanView hourPx={HOUR_PX} onSelect={setSel} selId={sel?.id} match={match} filtering={filtering} mode="plan" />}
          {view === "day"    && <DayView onSelect={setSel} selId={sel?.id} match={match} filtering={filtering} dayI={dayI} setDayI={setDayI} />}
          {view === "session" && session && <SessionDetail s={session} onBack={() => setView("week")} onOpenDay={(di) => { setDayI(di); setView("day"); }} />}
        </div>
      </div>

      <Inspector s={sel} rev={rev} apiOn={apiOn} editToken={editToken} onSave={saveSession} onClose={() => setSel(null)} onOpenSession={openSession} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
